version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shodh-backend
    restart: unless-stopped

    # Expose Spring Boot port
    ports:
      - "${BACKEND_PORT:-8080}:8080"

    # Mount code for hot reload & access host Docker
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

    # Use your MongoDB Atlas connection instead of local Mongo
    environment:
      # 👇 Paste your full Atlas connection string here
      - SPRING_DATA_MONGODB_URI=mongodb+srv://nipunjaipur:avzfc5ca@cluster0.brmeq86.mongodb.net/shodhdb?retryWrites=true&w=majority
      - DOCKER_HOST=unix:///var/run/docker.sock

    # Start Spring Boot app
    command: ./mvnw spring-boot:run